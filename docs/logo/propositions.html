<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Arcalyse / Arcature — propositions de logo</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1e1f24;color:#e6e6e6;padding:24px}
h1{font-size:20px;margin:0 0 6px}h2{font-size:16px;margin:26px 0 10px;border-bottom:1px solid #444;padding-bottom:4px}
.intro{font-size:13px;opacity:.8;margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.card{width:280px;border-radius:12px;padding:14px;box-sizing:border-box}
.dark{background:#15161a;border:1px solid #333;--bg:#15161a}.light{background:#f6f7f9;color:#222;border:1px solid #ddd;--bg:#f6f7f9}
.mark{display:flex;align-items:center;gap:12px}.mark b{font-size:24px;letter-spacing:.5px}
.small{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;opacity:.8}
p{font-size:13px;line-height:1.4;margin:8px 0 0}
.pair{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
</style></head><body>
<h1>Propositions de logo</h1>
<p class="intro">Couleurs des 4 couches ARCADIA : OA orange, SA bleu, LA vert d'eau, PA jaune. SVG pur, sans ressource externe.</p>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="out"></div>
<script>
const OA='#f0a35e',SA='#5aa2e8',LA='#4fc3a1',PA='#e8c84f',L4=[OA,SA,LA,PA];
// Secteur d'anneau (angles en degrés, 0 = droite, 180 = gauche, sens trigonométrique vers le haut)
function ring(cx,cy,R,r,a0,a1){const p=(rad,a)=>[cx+rad*Math.cos(a*Math.PI/180),cy-rad*Math.sin(a*Math.PI/180)].map(v=>v.toFixed(2)).join(' ');
 return `M${p(R,a0)}A${R} ${R} 0 0 1 ${p(R,a1)}L${p(r,a1)}A${r} ${r} 0 0 0 ${p(r,a0)}Z`;}
const S={
// ---------- Arcalyse ----------
lA:`<g fill="none" stroke-width="7" stroke-linecap="round"><path d="M10 80A40 40 0 0 1 90 80" stroke="${OA}"/><path d="M19 80A31 31 0 0 1 81 80" stroke="${SA}"/><path d="M28 80A22 22 0 0 1 72 80" stroke="${LA}"/><path d="M37 80A13 13 0 0 1 63 80" stroke="${PA}"/></g><circle cx="50" cy="80" r="5" fill="currentColor"/>`,
lB:`<g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85"><path d="M50 16L20 84M50 16L80 84"/><path d="M32 58Q50 40 68 58" stroke="${SA}" stroke-width="6"/></g><circle cx="50" cy="16" r="9" fill="${OA}"/><circle cx="20" cy="84" r="9" fill="${LA}"/><circle cx="80" cy="84" r="9" fill="${PA}"/><circle cx="32" cy="58" r="5" fill="${SA}"/><circle cx="68" cy="58" r="5" fill="${SA}"/>`,
lC:`<clipPath id="lens"><circle cx="42" cy="42" r="24"/></clipPath><g clip-path="url(#lens)">${L4.map((c,i)=>`<rect x="14" y="${24+i*10}" width="56" height="8" rx="3" fill="${c}"/>`).join('')}</g><circle cx="42" cy="42" r="27" fill="none" stroke="currentColor" stroke-width="7"/><path d="M62 62L86 86" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>`,
lD:`<g stroke="var(--bg)" stroke-width="4" stroke-linejoin="round"><path d="M50 8L92 50H50Z" fill="${OA}"/><path d="M92 50L50 92V50Z" fill="${SA}"/><path d="M50 92L8 50H50Z" fill="${LA}"/><path d="M8 50L50 8V50Z" fill="${PA}"/></g><circle cx="50" cy="50" r="9" fill="currentColor" stroke="var(--bg)" stroke-width="4"/>`,
lE:`<circle cx="44" cy="58" r="24" fill="none" stroke="${SA}" stroke-width="10"/><path d="M73 30V84" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><circle cx="73" cy="22" r="9" fill="${OA}"/><circle cx="44" cy="58" r="6" fill="${LA}"/>`,
lF:`<g fill="none" stroke-width="7" stroke-linecap="round"><path d="M14 62A24 24 0 0 1 38 86" stroke="${OA}"/><path d="M14 42A44 44 0 0 1 58 86" stroke="${SA}"/><path d="M14 22A64 64 0 0 1 78 86" stroke="${LA}"/></g><path d="M14 86L64 36" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="14" cy="86" r="6" fill="currentColor"/><circle cx="66" cy="34" r="8" fill="${PA}"/>`,
lG:`<path d="M16 76A34 34 0 0 1 84 76" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M8 86H92" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".5"/><circle cx="16" cy="76" r="9" fill="${OA}"/><circle cx="50" cy="42" r="9" fill="${SA}"/><circle cx="84" cy="76" r="9" fill="${PA}"/><circle cx="26" cy="52" r="6" fill="${LA}"/>`,
// ---------- Arcature ----------
tA:`<g fill="none" stroke-width="6" stroke-linejoin="round">${L4.map((c,i)=>{const x=10+i*20;return `<path d="M${x} 82V48A10 10 0 0 1 ${x+20} 48V82" stroke="${c}"/>`}).join('')}</g><path d="M4 86H96" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>`,
tB:`${[[180,138],[136,98],[82,44],[42,0]].map(([a,b],i)=>`<path d="${ring(50,80,42,24,a,b)}" fill="${L4[i]}"/>`).join('')}<path d="${ring(50,80,46,22,97,83)}" fill="currentColor"/><path d="M4 86H96" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`,
tC:`<path d="M12 82A38 38 0 0 1 88 82" fill="none" stroke="currentColor" stroke-width="6"/>${[150,110,70,30].map((a,i)=>{const r=Math.PI/180*a;return `<path d="M50 82L${(50+38*Math.cos(r)).toFixed(1)} ${(82-38*Math.sin(r)).toFixed(1)}" stroke="${L4[i]}" stroke-width="5" stroke-linecap="round"/><circle cx="${(50+38*Math.cos(r)).toFixed(1)}" cy="${(82-38*Math.sin(r)).toFixed(1)}" r="5.5" fill="${L4[i]}"/>`}).join('')}<path d="M6 86H94" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="82" r="6" fill="currentColor"/>`,
tD:`<g fill="none" stroke-width="7" stroke-linecap="round"><path d="M50 12L16 86" stroke="currentColor"/><path d="M50 12L84 86" stroke="currentColor"/></g>${L4.map((c,i)=>{const y=40+i*12,h=(y-12)*34/74;return `<path d="M${(50-h).toFixed(1)} ${y}H${(50+h).toFixed(1)}" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`}).join('')}`,
};
document.getElementById('defs').innerHTML=Object.entries(S).map(([k,v])=>`<symbol id="${k}" viewBox="0 0 100 100">${v}</symbol>`).join('');
const G=[
['Arcalyse — premières propositions','Arcalyse',[['lA','A — Arcs stratifiés','Les 4 couches en arcs autour d\'un point d\'analyse.'],['lB','B — Le « A » en graphe','Lettre A en petite Relation Map.'],['lC','C — Loupe sur les couches','« Analyser le modèle », classique.']]],
['Arcalyse — nouvelles propositions','Arcalyse',[['lD','D — Losange à 4 facettes','Reprend l\'actuel 🔷 de l\'À propos : continuité, très compact.'],['lE','E — Monogramme « a »','Un « a » minuscule dont la hampe porte un nœud : lettre + graphe.'],['lF','F — Sonar','Ondes depuis un coin, un élément détecté : « explorer, trouver ».'],['lG','G — Chaîne en arc','Nœuds reliés par un arc pointillé : traçabilité, chaînes.']]],
['Arcature — propositions (outil compagnon)','Arcature',[['tA','1 — Arcade','Une arcature, au sens architectural : 4 arches côte à côte = 4 couches posées sur un socle. Jeu de mots direct.'],['tB','2 — Clé de voûte','Arc en voussoirs colorés tenu par une clé de voûte : l\'architecture qui tient.'],['tC','3 — Armature','Arc et rayons porteurs : l\'ossature (armature) de l\'architecture.'],['tD','4 — « A » en échafaudage','Un A dont les traverses sont les couches : on construit étage par étage.']]],
];
let h='';
for(const[title,name,items]of G){h+=`<h2>${title}</h2>`;for(const tone of['dark','light']){h+='<div class="row">';for(const[id,t,d]of items)h+=`<div class="card ${tone}"><div class="mark"><svg width="60" height="60"><use href="#${id}"/></svg><b>${name}</b></div><div class="small"><svg width="32" height="32"><use href="#${id}"/></svg><svg width="16" height="16"><use href="#${id}"/></svg> 32 px · 16 px</div><p><b>${t}</b><br>${d}</p></div>`;h+='</div>'}}
h+='<h2>Familles possibles (même trait, même palette)</h2>';
for(const tone of['dark','light']){h+='<div class="row">';for(const[a,b,t]of[['lA','tA','Arcs / Arcade'],['lG','tB','Chaîne en arc / Clé de voûte'],['lD','tD','Losange / « A » échafaudage']])h+=`<div class="card ${tone}" style="width:420px"><div class="pair"><div class="mark"><svg width="48" height="48"><use href="#${a}"/></svg><b style="font-size:20px">Arcalyse</b></div><div class="mark"><svg width="48" height="48"><use href="#${b}"/></svg><b style="font-size:20px">Arcature</b></div></div><p>${t}</p></div>`;h+='</div>'}
document.getElementById('out').innerHTML=h;
</script></body></html>
