<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Arcalyse — propositions de logo</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1e1f24;color:#e6e6e6;padding:24px}
h1{font-size:20px;margin:0 0 16px}
.row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.card{width:300px;border-radius:12px;padding:16px;box-sizing:border-box}
.dark{background:#15161a;border:1px solid #333}.light{background:#f6f7f9;color:#222;border:1px solid #ddd}
.mark{display:flex;align-items:center;gap:12px}.mark b{font-size:26px;letter-spacing:.5px}
.small{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:12px;opacity:.8}
p{font-size:13px;line-height:1.4;margin:10px 0 0}
</style></head><body>
<h1>Arcalyse — 3 propositions de logo (couleurs des couches ARCADIA : OA, SA, LA, PA)</h1>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <!-- A : arcs stratifiés -->
  <symbol id="lA" viewBox="0 0 100 100">
   <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M10 80A40 40 0 0 1 90 80" stroke="#f0a35e"/>
    <path d="M19 80A31 31 0 0 1 81 80" stroke="#5aa2e8"/>
    <path d="M28 80A22 22 0 0 1 72 80" stroke="#4fc3a1"/>
    <path d="M37 80A13 13 0 0 1 63 80" stroke="#e8c84f"/>
   </g>
   <circle cx="50" cy="80" r="5" fill="currentColor"/>
  </symbol>
  <!-- B : le « A » en graphe -->
  <symbol id="lB" viewBox="0 0 100 100">
   <g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M50 16L20 84M50 16L80 84"/>
    <path d="M32 58Q50 40 68 58" stroke="#5aa2e8" stroke-width="6"/>
   </g>
   <circle cx="50" cy="16" r="9" fill="#f0a35e"/>
   <circle cx="20" cy="84" r="9" fill="#4fc3a1"/>
   <circle cx="80" cy="84" r="9" fill="#e8c84f"/>
   <circle cx="32" cy="58" r="5" fill="#5aa2e8"/><circle cx="68" cy="58" r="5" fill="#5aa2e8"/>
  </symbol>
  <!-- C : loupe sur les couches -->
  <clipPath id="lens"><circle cx="42" cy="42" r="24"/></clipPath>
  <symbol id="lC" viewBox="0 0 100 100">
   <g clip-path="url(#lens)">
    <rect x="14" y="24" width="56" height="8" rx="3" fill="#f0a35e"/>
    <rect x="14" y="34" width="56" height="8" rx="3" fill="#5aa2e8"/>
    <rect x="14" y="44" width="56" height="8" rx="3" fill="#4fc3a1"/>
    <rect x="14" y="54" width="56" height="8" rx="3" fill="#e8c84f"/>
   </g>
   <circle cx="42" cy="42" r="27" fill="none" stroke="currentColor" stroke-width="7"/>
   <path d="M62 62L86 86" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
  </symbol>
 </defs>
</svg>
<script>
const P=[['lA','A — Arcs stratifiés','« Arc » d\'Arcalyse + les 4 couches ARCADIA empilées autour d\'un point d\'analyse. Simple, lisible en 16 px, très identifiable.'],
['lB','B — Le « A » en graphe','La lettre A dessinée comme une petite Relation Map : nœuds colorés par couche, barre en arc. Évoque l\'exploration des liens.'],
['lC','C — Loupe sur les couches','Une loupe sur les 4 couches : « analyser le modèle ». Message très clair, un peu plus classique.']];
let h='';for(const tone of ['dark','light']){h+='<div class="row">';for(const[id,t,d]of P){h+=`<div class="card ${tone}"><div class="mark"><svg width="64" height="64"><use href="#${id}"/></svg><b>Arcalyse</b></div>
<div class="small"><svg width="32" height="32"><use href="#${id}"/></svg><svg width="16" height="16"><use href="#${id}"/></svg> 32 px · 16 px</div>
<p><b>${t}</b><br>${d}</p></div>`}h+='</div>'}
document.write(h);
</script></body></html>
